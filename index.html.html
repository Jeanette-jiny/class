<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4ef">
  <title>人大校园 · 压力回血盲盒</title>
  <style>
    :root { --ink:#26352d; --muted:#718077; --green:#47745b; --green-dark:#31583f; --cream:#f5f4ef; --card:#fffefa; --line:#e6e9df; --orange:#d58a55; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; padding:28px 16px; display:flex; justify-content:center; align-items:center; color:var(--ink); background:radial-gradient(circle at 10% 8%,#e8eee1 0,transparent 32%),radial-gradient(circle at 90% 90%,#f1e5d6 0,transparent 30%),var(--cream); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .app { width:min(100%,560px); }
    .eyebrow { color:var(--green); font-size:12px; font-weight:750; letter-spacing:.16em; text-align:center; margin-bottom:9px; }
    h1 { text-align:center; font-size:clamp(25px,6vw,34px); line-height:1.2; letter-spacing:.02em; }
    .subtitle { color:var(--muted); text-align:center; font-size:14px; margin:10px auto 22px; max-width:440px; line-height:1.7; }
    .panel { padding:18px; border:1px solid rgba(255,255,255,.8); border-radius:25px; background:rgba(255,255,255,.72); box-shadow:0 18px 55px rgba(48,66,49,.11); backdrop-filter:blur(12px); }
    .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; padding:5px; border-radius:16px; background:#edf0e9; margin-bottom:15px; }
    .tab { border:0; border-radius:12px; padding:10px 3px; color:#718077; background:transparent; cursor:pointer; font-size:12px; font-weight:700; transition:.2s; }
    .tab span { display:block; font-size:17px; margin-bottom:3px; }
    .tab.active { color:white; background:var(--green); box-shadow:0 4px 12px #47745b40; }
    .range-note { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:0 3px 12px; color:var(--muted); font-size:12px; }
    .range-note strong { color:var(--green-dark); font-size:13px; }
    .card { min-height:330px; padding:22px; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 8px 22px #253d2b0d; transition:transform .18s ease,opacity .18s ease; }
    .placeholder { flex:1; min-height:280px; display:grid; place-content:center; text-align:center; color:var(--muted); line-height:1.8; }
    .placeholder .box { font-size:48px; margin-bottom:8px; }
    .placeholder strong { display:block; color:var(--ink); font-size:17px; }
    .card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:17px; }
    .tag { color:#fff; background:var(--green); border-radius:99px; padding:5px 11px; font-weight:750; font-size:11px; }
    .odds { color:var(--muted); background:#f1f2ed; border-radius:99px; padding:5px 9px; font-size:11px; }
    .name { font-size:21px; line-height:1.4; margin-bottom:11px; color:#26372d; }
    .desc { color:#526157; background:#f4f6f0; border-left:3px solid #83a17f; padding:12px 13px; border-radius:8px 12px 12px 8px; font-size:14px; line-height:1.75; margin-bottom:14px; }
    .details { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:auto; }
    .detail { border:1px solid #eceee8; border-radius:12px; padding:11px; font-size:12px; line-height:1.65; color:#647067; }
    .detail b { display:block; color:var(--green-dark); margin-bottom:4px; font-size:12px; }
    .draw { width:100%; border:0; border-radius:15px; padding:15px 20px; margin-top:15px; color:white; font-size:15px; font-weight:800; letter-spacing:.04em; background:linear-gradient(135deg,#548063,#31583f); box-shadow:0 7px 17px #31583f35; cursor:pointer; transition:transform .15s,filter .15s; }
    .draw:hover { filter:brightness(1.06); transform:translateY(-1px); }
    .draw:active { transform:scale(.985); }
    .foot { color:#829086; display:flex; justify-content:space-between; gap:8px; font-size:11px; padding:13px 4px 0; }
    .note { text-align:center; color:#8a938b; font-size:11px; margin-top:13px; line-height:1.6; }
    .toolbar { display:flex; justify-content:center; margin:0 auto 13px; }
    .manage-link { border:1px solid #dce4d9; color:var(--green-dark); background:#ffffffa8; border-radius:99px; padding:8px 15px; font-size:12px; font-weight:700; cursor:pointer; }
    .manage-link:hover { background:#fff; }
    .view[hidden] { display:none; }
    .manage-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; }
    .manage-head h2 { font-size:19px; }
    .back-link { border:0; background:transparent; color:var(--green); font-weight:750; cursor:pointer; padding:8px 0; }
    .form { display:grid; gap:12px; }
    .field { display:grid; gap:6px; text-align:left; }
    .field label { color:#526157; font-size:12px; font-weight:750; }
    .field input,.field textarea,.field select { width:100%; border:1px solid #dfe5dc; border-radius:11px; background:#fff; padding:11px 12px; color:var(--ink); font:inherit; font-size:14px; outline:none; }
    .field input:focus,.field textarea:focus,.field select:focus { border-color:#78a082; box-shadow:0 0 0 3px #47745b18; }
    .field textarea { min-height:78px; resize:vertical; line-height:1.55; }
    .form .draw { margin-top:2px; }
    .saved-list { margin-top:20px; border-top:1px solid var(--line); padding-top:15px; }
    .saved-list h3 { font-size:14px; margin-bottom:9px; }
    .saved-empty { color:var(--muted); font-size:12px; }
    .saved-item { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #edf0e9; text-align:left; }
    .saved-item strong { display:block; font-size:13px; line-height:1.5; }
    .saved-item small { display:block; margin-top:3px; color:var(--muted); font-size:11px; }
    .delete-item { flex:none; border:0; background:#f8ece8; color:#a2523e; border-radius:8px; padding:6px 9px; cursor:pointer; font-size:11px; }
    .toast { min-height:18px; color:var(--green-dark); font-size:12px; text-align:center; }
    @media(max-width:420px) { .panel{padding:13px}.tab{font-size:10px}.card{padding:17px;min-height:350px}.name{font-size:19px}.detail{padding:9px;font-size:11px}.foot{font-size:10px} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after{scroll-behavior:auto!important;transition:none!important} }
  </style>
</head>
<body>
  <main class="app">
    <div class="eyebrow">RENMIN UNIVERSITY · CAMPUS EDITION</div>
    <h1>🎓 压力回血盲盒</h1>
    <p class="subtitle">忙里偷闲也算休息。按你现在能腾出的时间，抽一个人大校园里的小放松。</p>
    <div class="toolbar" id="homeToolbar"><button class="manage-link" id="openManager">＋ 添加自己的放松选项</button></div>
    <section class="panel view" id="homeView" aria-label="解压盲盒">
      <div class="tabs" role="tablist" aria-label="选择可用时间">
        <button class="tab active" role="tab" aria-selected="true" data-pool="sec"><span>⚡</span>秒级</button>
        <button class="tab" role="tab" aria-selected="false" data-pool="min"><span>⏱️</span>分钟级</button>
        <button class="tab" role="tab" aria-selected="false" data-pool="ten"><span>🌿</span>十分钟级</button>
        <button class="tab" role="tab" aria-selected="false" data-pool="long"><span>☀️</span>1–2小时</button>
      </div>
      <div class="range-note"><strong id="rangeTitle">⚡ 0–60秒</strong></div>
      <article class="card" id="card" aria-live="polite">
        <div class="placeholder" id="content"><div><div class="box">🎁</div><strong>准备好给自己一点喘息了吗？</strong><span>选好时间档，点击下方开盲盒</span></div></div>
      </article>
      <button class="draw" id="drawButton">🎲 抽取一个解压方式</button>
      <div class="foot"><span>📍 中国人民大学校园生活灵感</span><span id="drawCount">已抽取 0 次</span></div>
    </section>
    <section class="panel view" id="manageView" hidden aria-label="添加放松选项">
      <div class="manage-head"><h2>添加一个放松选项</h2><button class="back-link" id="backHome">← 返回盲盒</button></div>
      <form class="form" id="optionForm">
        <div class="field"><label for="optionPool">放进哪个时间档</label><select id="optionPool" required><option value="sec">⚡ 秒级（0–60秒）</option><option value="min">⏱️ 分钟级（1–10分钟）</option><option value="ten">🌿 十分钟级（10–30分钟）</option><option value="long">☀️ 1–2小时级</option></select></div>
        <div class="field"><label for="optionName">选项名称</label><input id="optionName" maxlength="50" placeholder="例如：去静园水果店买份水果" required></div>
        <div class="field"><label for="optionDesc">怎么做</label><textarea id="optionDesc" maxlength="240" placeholder="简单描述具体做法" required></textarea></div>
        <div class="field"><label for="optionTime">需要多久</label><input id="optionTime" maxlength="30" placeholder="例如：约15分钟" required></div>
        <div class="field"><label for="optionMoney">大约花费</label><input id="optionMoney" maxlength="40" placeholder="例如：0元 / 约10–20元" required></div>
        <div class="field"><label for="optionEffect">放松在哪里</label><textarea id="optionEffect" maxlength="180" placeholder="写清它能带来的实际放松感" required></textarea></div>
        <button class="draw" type="submit">保存并加入盲盒</button>
        <div class="toast" id="formToast" role="status"></div>
      </form>
      <div class="saved-list"><h3>我添加的选项</h3><div id="savedOptions" class="saved-empty">还没有自定义选项</div></div>
    </section>
    <p class="note">抽到不合适的可以再抽一次；休息方式按自己的身体状况和实际安排选择。</p>
  </main>

      {pool:'long',name:'和朋友约一场桌游或轻松的合作游戏',desc:'约几位朋友玩一到两小时桌游或合作游戏，选规则熟悉、输赢压力小的，不临时开一场高强度竞技。',time:'约1–2小时',money:'约0–50元，视地点和消费而定',effect:'让注意力投入到共同活动中，也能获得与朋友相处的时间。'},
      {pool:'long',name:'在校园里慢走，顺路聊聊天',desc:'约同学在校园里走一段熟悉路线，想聊天就聊近况，不想说话也可以并排走。',time:'约1–1.5小时',money:'0元',effect:'活动身体、离开室内，也给交流和放空都留出空间。'},
      {pool:'long',name:'回宿舍补觉，醒来后慢慢收拾自己',desc:'把手机调成免打扰，设好闹钟，睡一会儿；醒来后洗漱、喝水或吃点东西，不马上接着刷消息。',time:'约1–2小时',money:'0元',effect:'适合确实缺觉或疲惫的时候，把休息优先留给身体。'},
      {pool:'long',name:'找朋友看一场电影',desc:'约朋友去看一场时长合适的电影，算上往返和入场时间控制在两小时左右。',time:'约1.5–2小时',money:'约30–80元',effect:'暂时把注意力交给一个完整的故事，也有一段轻松的同伴时间。'}
    ];

    const pools = {
      sec:{title:'⚡ 0–60秒',label:'秒级'},
      min:{title:'⏱️ 1–10分钟',label:'分钟级'},
      ten:{title:'🌿 10–30分钟',label:'十分钟级'},
      long:{title:'☀️ 1–2小时',label:'1–2小时级'}
    };
    const STORAGE_KEY='ruc_stress_blindbox_custom_v1';
    let customData=[];
    try { customData=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); if(!Array.isArray(customData)) customData=[]; } catch { customData=[]; }
    let currentPool='sec', draws=0, lastName='';
    const content=document.getElementById('content');
    const card=document.getElementById('card');
    function setPool(pool) {
      currentPool=pool;
      document.querySelectorAll('.tab').forEach(btn=>{
        const active=btn.dataset.pool===pool;
        btn.classList.toggle('active',active);
        btn.setAttribute('aria-selected',String(active));
      });
      document.getElementById('rangeTitle').textContent=pools[pool].title;
    }
    function draw() {
      const choices=[...data,...customData].filter(x=>x.pool===currentPool);
      let options=choices.filter(x=>x.name!==lastName);
      if(!options.length) options=choices;
      const item=options[Math.floor(Math.random()*options.length)];
      lastName=item.name; draws++;
      document.getElementById('drawCount').textContent=`已抽取 ${draws} 次`;
      card.style.transform='scale(.985)'; card.style.opacity='.65';
      window.setTimeout(()=>{
        content.className='';
        content.innerHTML=`
          <div class="card-top"><span class="tag">${pools[item.pool].label}</span><span class="odds">本档随机抽取</span></div>
          <h2 class="name">✨ ${item.name}</h2>
          <div class="desc"><b>怎么做：</b>${item.desc}</div>
          <div class="details">
            <div class="detail"><b>⏳ 时间与花费</b>时间：${item.time}<br>经济：${item.money}</div>
            <div class="detail"><b>🍃 放松在哪里</b>${item.effect}</div>
          </div>`;
        card.style.transform='scale(1)'; card.style.opacity='1';
      },130);
    }
    document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>setPool(btn.dataset.pool)));
    document.getElementById('drawButton').addEventListener('click',draw);
    const homeView=document.getElementById('homeView'), manageView=document.getElementById('manageView');
    function showManager(show) {
      homeView.hidden=show; manageView.hidden=!show;
      document.getElementById('homeToolbar').hidden=show;
      document.querySelector('.note').hidden=show;
      if(show) renderCustomOptions();
    }
    function persistCustom() { localStorage.setItem(STORAGE_KEY,JSON.stringify(customData)); }
    function renderCustomOptions() {
      const root=document.getElementById('savedOptions');
      if(!customData.length) { root.className='saved-empty'; root.textContent='还没有自定义选项'; return; }
      root.className=''; root.innerHTML='';
      customData.forEach(item=>{
        const row=document.createElement('div'); row.className='saved-item';
        const copy=document.createElement('div');
        const title=document.createElement('strong'); title.textContent=item.name;
        const meta=document.createElement('small'); meta.textContent=`${pools[item.pool].label} · ${item.time} · ${item.money}`;
        copy.append(title,meta);
        const remove=document.createElement('button'); remove.className='delete-item'; remove.type='button'; remove.textContent='删除';
        remove.addEventListener('click',()=>{ customData=customData.filter(x=>x.id!==item.id); persistCustom(); renderCustomOptions(); });
        row.append(copy,remove); root.append(row);
      });
    }
    document.getElementById('openManager').addEventListener('click',()=>showManager(true));
    document.getElementById('backHome').addEventListener('click',()=>showManager(false));
    document.getElementById('optionForm').addEventListener('submit',event=>{
      event.preventDefault();
      const item={id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,pool:document.getElementById('optionPool').value,name:document.getElementById('optionName').value.trim(),desc:document.getElementById('optionDesc').value.trim(),time:document.getElementById('optionTime').value.trim(),money:document.getElementById('optionMoney').value.trim(),effect:document.getElementById('optionEffect').value.trim()};
      if(!item.name||!item.desc||!item.time||!item.money||!item.effect) return;
      customData.push(item); persistCustom(); renderCustomOptions();
      event.target.reset();
      document.getElementById('formToast').textContent='已保存，这个选项会出现在对应档位的抽取里。';
      window.setTimeout(()=>document.getElementById('formToast').textContent='',2600);
    });
    setPool(currentPool);
  </script>
</body>
</html>
